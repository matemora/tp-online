<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web PiP Teleprompter</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background: #f4f4f4; }
        textarea { width: 100%; height: 150px; margin-bottom: 10px; border-radius: 8px; padding: 10px; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        button { padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        canvas { display: none; } /* O canvas não precisa aparecer na página */
    </style>
</head>
<body>

    <h2>Teleprompter PiP</h2>
    <textarea id="textInput">Escreva seu roteiro aqui... Este texto vai subir suavemente na janelinha flutuante para que você possa gravar seus vídeos com facilidade!</textarea>

    <div class="controls">
        <label>Velocidade: <input type="range" id="speedRange" min="1" max="5" step="0.5" value="1.5"></label>
        <button id="startBtn">ATIVAR MODO FLUTUANTE (PiP)</button>
    </div>

    <canvas id="tpCanvas" width="400" height="300"></canvas>

    <script>
        // 1. Configuração Global do Elemento de Vídeo (Obrigatório para Mobile)
const video = document.createElement('video');
video.muted = true;
video.playsInline = true; 
video.setAttribute('autoplay', '');
video.setAttribute('muted', '');

// O vídeo precisa estar no DOM para o Mobile aceitar o PiP, mas deixamos invisível
video.style.cssText = "position:fixed; bottom:0; right:0; width:10px; height:10px; z-index:-1; opacity:0.01; pointer-events:none;";
document.body.appendChild(video);

const canvas = document.getElementById('tpCanvas');
const ctx = canvas.getContext('2d');
const textInput = document.getElementById('textInput');
const speedRange = document.getElementById('speedRange');
const startBtn = document.getElementById('startBtn');

let yPos = canvas.height;
let animationId = null;

// 2. Função de Renderização do Teleprompter
function drawText() {
    // Fundo preto e limpeza
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Configuração do Texto
    ctx.fillStyle = "white";
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "center";

    const lines = wrapText(textInput.value, 360);
    
    lines.forEach((line, index) => {
        ctx.fillText(line, canvas.width / 2, yPos + (index * 35));
    });

    // Ajuste de Velocidade
    yPos -= parseFloat(speedRange.value);

    // Loop infinito do texto
    if (yPos < -(lines.length * 35)) {
        yPos = canvas.height;
    }

    animationId = requestAnimationFrame(drawText);
}

// 3. Função Auxiliar para Quebrar Linhas
function wrapText(text, maxWidth) {
    const words = text.split(' ');
    let lines = [];
    let currentLine = words[0];

    for (let i = 1; i < words.length; i++) {
        let word = words[i];
        let width = ctx.measureText(currentLine + " " + word).width;
        if (width < maxWidth) {
            currentLine += " " + word;
        } else {
            lines.push(currentLine);
            currentLine = word;
        }
    }
    lines.push(currentLine);
    return lines;
}

// 4. Lógica Principal de Ativação do PiP
async function ativarTeleprompter() {
    // Reinicia a posição se já estava rodando
    if (animationId) cancelAnimationFrame(animationId);
    yPos = canvas.height;
    drawText();

    // Captura o stream do canvas (30 quadros por segundo)
    const stream = canvas.captureStream(30);
    video.srcObject = stream;

    try {
        // Passo crítico para Mobile: Play imediato após o clique
        await video.play();

        // Aguarda o stream "aquecer" no buffer do vídeo
        video.onloadedmetadata = async () => {
            try {
                if (document.pictureInPictureEnabled) {
                    await video.requestPictureInPicture();
                } else {
                    alert("Seu navegador ou dispositivo não suporta a função de tela flutuante (PiP).");
                }
            } catch (err) {
                console.error("Erro ao solicitar PiP:", err);
                alert("Erro: O navegador bloqueou a janela. Tente clicar novamente.");
            }
        };

        // Fallback caso o onloadedmetadata demore demais (comum em alguns Androids)
        setTimeout(async () => {
            if (!document.pictureInPictureElement) {
                await video.requestPictureInPicture().catch(() => {});
            }
        }, 500);

    } catch (error) {
        console.error("Erro ao iniciar vídeo:", error);
        alert("Certifique-se de estar usando Chrome/Safari e que o site esteja em HTTPS.");
    }
}

// Evento de Clique
startBtn.addEventListener('click', ativarTeleprompter);
    </script>
</body>
</html>
